<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B0F"/>
      <stop offset="100%" stop-color="#131318"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(59,130,246,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- Gateway node -->
  <rect x="520" y="90" width="160" height="56" rx="10" fill="#16161B" stroke="rgba(59,130,246,0.5)" stroke-width="1.5"/>
  <text x="600" y="123" text-anchor="middle" fill="#F5F5F7" font-family="ui-monospace, monospace" font-size="15" font-weight="600">API Gateway</text>

  <!-- connecting lines -->
  <path d="M600 146 L340 260" stroke="rgba(59,130,246,0.35)" stroke-width="1.5" fill="none"/>
  <path d="M600 146 L600 260" stroke="rgba(59,130,246,0.35)" stroke-width="1.5" fill="none"/>
  <path d="M600 146 L860 260" stroke="rgba(59,130,246,0.35)" stroke-width="1.5" fill="none"/>

  <!-- service nodes -->
  <g>
    <rect x="240" y="260" width="200" height="76" rx="10" fill="#111113" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="340" y="292" text-anchor="middle" fill="#F5F5F7" font-family="ui-monospace, monospace" font-size="14" font-weight="600">Auth Service</text>
    <text x="340" y="314" text-anchor="middle" fill="#71717A" font-family="ui-monospace, monospace" font-size="11">Spring Security</text>
  </g>
  <g>
    <rect x="500" y="260" width="200" height="76" rx="10" fill="#111113" stroke="rgba(59,130,246,0.45)" stroke-width="1.5"/>
    <text x="600" y="292" text-anchor="middle" fill="#F5F5F7" font-family="ui-monospace, monospace" font-size="14" font-weight="600">Inventory Service</text>
    <text x="600" y="314" text-anchor="middle" fill="#71717A" font-family="ui-monospace, monospace" font-size="11">Spring Boot · MySQL</text>
  </g>
  <g>
    <rect x="760" y="260" width="200" height="76" rx="10" fill="#111113" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="860" y="292" text-anchor="middle" fill="#F5F5F7" font-family="ui-monospace, monospace" font-size="14" font-weight="600">Order Service</text>
    <text x="860" y="314" text-anchor="middle" fill="#71717A" font-family="ui-monospace, monospace" font-size="11">Spring Boot · MySQL</text>
  </g>

  <path d="M340 336 L340 430" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none"/>
  <path d="M600 336 L600 430" stroke="rgba(59,130,246,0.35)" stroke-width="1.5" fill="none"/>
  <path d="M860 336 L860 430" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none"/>

  <rect x="240" y="430" width="720" height="60" rx="10" fill="#0E0E11" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="600" y="466" text-anchor="middle" fill="#A1A1AA" font-family="ui-monospace, monospace" font-size="13">MySQL · per-service schemas</text>

  <text x="80" y="690" fill="#3B82F6" font-family="ui-monospace, monospace" font-size="14" font-weight="600">// inventory-microservice-platform</text>
</svg>
