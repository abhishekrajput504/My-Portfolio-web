<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B0F"/>
      <stop offset="100%" stop-color="#131318"/>
    </linearGradient>
    <pattern id="grid2" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(59,130,246,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)"/>
  <rect width="1200" height="750" fill="url(#grid2)"/>

  <!-- device nodes -->
  <g>
    <circle cx="220" cy="180" r="34" fill="#111113" stroke="rgba(59,130,246,0.5)" stroke-width="1.5"/>
    <text x="220" y="185" text-anchor="middle" fill="#F5F5F7" font-family="ui-monospace, monospace" font-size="11" font-weight="600">ESP</text>
  </g>
  <g>
    <circle cx="220" cy="300" r="34" fill="#111113" stroke="rgba(59,130,246,0.5)" stroke-width="1.5"/>
    <text x="220" y="305" text-anchor="middle" fill="#F5F5F7" font-family="ui-monospace, monospace" font-size="11" font-weight="600">ESP</text>
  </g>
  <g>
    <circle cx="220" cy="420" r="34" fill="#111113" stroke="rgba(59,130,246,0.5)" stroke-width="1.5"/>
    <text x="220" y="425" text-anchor="middle" fill="#F5F5F7" font-family="ui-monospace, monospace" font-size="11" font-weight="600">ESP</text>
  </g>

  <path d="M254 180 L420 300" stroke="rgba(59,130,246,0.3)" stroke-width="1.5" fill="none"/>
  <path d="M254 300 L420 300" stroke="rgba(59,130,246,0.3)" stroke-width="1.5" fill="none"/>
  <path d="M254 420 L420 300" stroke="rgba(59,130,246,0.3)" stroke-width="1.5" fill="none"/>

  <!-- MQTT broker -->
  <rect x="420" y="262" width="170" height="76" rx="10" fill="#16161B" stroke="rgba(59,130,246,0.5)" stroke-width="1.5"/>
  <text x="505" y="294" text-anchor="middle" fill="#F5F5F7" font-family="ui-monospace, monospace" font-size="14" font-weight="600">MQTT Broker</text>
  <text x="505" y="316" text-anchor="middle" fill="#71717A" font-family="ui-monospace, monospace" font-size="11">Mosquitto</text>

  <path d="M590 300 L740 300" stroke="rgba(59,130,246,0.35)" stroke-width="1.5" fill="none"/>

  <!-- backend -->
  <rect x="740" y="262" width="190" height="76" rx="10" fill="#111113" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <text x="835" y="294" text-anchor="middle" fill="#F5F5F7" font-family="ui-monospace, monospace" font-size="14" font-weight="600">Spring Boot</text>
  <text x="835" y="316" text-anchor="middle" fill="#71717A" font-family="ui-monospace, monospace" font-size="11">MQTT consumer + REST</text>

  <path d="M930 300 L1030 300" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none"/>

  <!-- dashboard -->
  <rect x="1000" y="230" width="150" height="140" rx="10" fill="#0E0E11" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="1075" y="258" text-anchor="middle" fill="#A1A1AA" font-family="ui-monospace, monospace" font-size="11">Dashboard</text>
  <polyline points="1015,340 1040,300 1065,320 1090,270 1130,290" fill="none" stroke="#3B82F6" stroke-width="2"/>

  <text x="80" y="690" fill="#3B82F6" font-family="ui-monospace, monospace" font-size="14" font-weight="600">// iot-telemetry-dashboard</text>
</svg>
